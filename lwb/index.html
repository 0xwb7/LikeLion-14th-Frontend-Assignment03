<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 Todo 페이지</title>
</head>
<body>
    <main>
        <header>
            <p>Todo</p>
            <h1>오늘의 할 일</h1>
        </header>

        <form class="todo-form" id="todoForm">
            <input type="text" id="todoInput" class="todo-input" placeholder="할 일을 입력하세요" autocomplete="off" required>
            <button type="submit" class="todo-button">추가</button>
        </form>

        <ul class="todo-list" id="todoList">
            <li class="todo-item">
                <input type="checkbox" class="todo-checkbox">
                <span class="todo-text">test1</span>
                <button class="todo-delete" type="button">삭제</button>
            </li>
        </ul>
        <p class="empty" id="emptyMessage" hidden>아직 등록된 할 일이 없어요.</p>
    </main>
</body>
</html>
