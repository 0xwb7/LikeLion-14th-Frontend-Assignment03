<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 Todo 페이지</title>
    <link rel="stylesheet" href="index.css">
    <script defer src="index.js"></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <p class="app-name">Todo</p>
            <h1 class="app-title">오늘의 할 일</h1>
        </header>

        <form class="todo-form" id="todoForm">
            <input type="text" id="todoInput" class="todo-input" placeholder="할 일을 입력하세요" autocomplete="off">
            <button type="submit" class="todo-button">추가</button>
        </form>

        <ul class="todo-list" id="todoList">
            <li class="todo-item done">
                <input type="checkbox" class="todo-checkbox" checked>
                <span class="todo-text">프론트 과제하기</span>
                <button class="todo-delete" type="button">삭제</button>
            </li>
        </ul>
        <p class="empty" id="emptyMessage" hidden>아직 등록된 할 일이 없어요.</p>
    </main>
</body>
</html>
